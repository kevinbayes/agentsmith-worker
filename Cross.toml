# aarch64 Linux is built with --no-default-features in CI (Signal is x86_64
# Linux only — see .github/workflows/release.yml), so the cross container
# doesn't need libsqlite3-dev:arm64, libssl-dev:arm64, protoc, or cmake.
# All remaining deps are pure-Rust or rustls-based and cross-compile cleanly
# without any extra apt packages.
#
# Re-add a pre-build block here if you ever bring the `signal` feature back
# for aarch64 — you'd need a newer base image (Ubuntu 22.04+) for OpenSSL 3
# and protoc 3.12+, plus libsqlite3-dev:arm64 + libssl-dev:arm64.
