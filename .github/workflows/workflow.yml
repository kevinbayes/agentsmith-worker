name: Build AgentSmith Remote Worker
run-name: ${{ github.actor }} testing the build succeeds.
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libsqlite3-dev cmake clang protobuf-compiler
      - name: Build
        run: cargo build --workspace --verbose
#      - name: Run tests
#        run: cargo test --verbose
