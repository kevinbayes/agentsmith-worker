[package]
name = "agentsmith-remote-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

# Serialization & config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Async trait
async-trait = "0.1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Cron scheduling
cron = "0.16"

# Signal (presage) - upstream git (not yet published to crates.io)
presage = { git = "https://github.com/whisperfish/presage", branch = "main" }
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", branch = "main" }

qr2term = "0.3"

# Slack
slack-morphism = { version = "2", features = ["hyper"] }

# Telegram — use rustls to avoid linker conflict with Signal's BoringSSL
teloxide = { version = "0.17", default-features = false, features = ["macros", "rustls", "ctrlc_handler"] }

# TLS (rustls crypto provider — needed by slack-morphism's hyper-rustls)
rustls = { version = "0.23", features = ["ring"] }

# PTY
portable-pty = "0.9"

# ANSI stripping
strip-ansi-escapes = "0.2"

# HTTP client (for Anthropic API)
reqwest = { version = "0.13", features = ["json", "form"] }

# Web server
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }

# UUID
uuid = { version = "1", features = ["v4"] }

# Process monitoring
sysinfo = "0.38"
which = "8"

# Agent management — archive extraction & install
tar = "0.4"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
dirs = "5"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
curve25519-dalek = { git = "https://github.com/signalapp/curve25519-dalek", tag = "signal-curve25519-4.1.3" }
libsqlite3-sys = { git = "https://github.com/whisperfish/rusqlite", rev = "2a42b3354c9194700d08aa070f70a131a470e7dc" }
